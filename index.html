<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>分享對話轉 Log</title>
<style>
  /* 單欄工具：輸入在上、預覽在下，手機優先 */
  :root {
    --bg: #f6f5f8;
    --panel: #ffffff;
    --fg: #23212a;
    --muted: #6b6775;
    --line: #dcd9e3;
    --accent: #6a4fb3;
    --accent-fg: #ffffff;
    --ok: #2f7a4f;
    --err: #b3392f;
    --font: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161b; --panel: #211f27; --fg: #ebe8f0; --muted: #a29eac;
      --line: #36333f; --accent: #a58cf0; --accent-fg: #17161b;
      --ok: #6fc794; --err: #f08a80;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--font);
    padding-top: max(20px, env(safe-area-inset-top, 0px));
    padding-bottom: max(32px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 640px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { font-size: 20px; margin: 0; text-wrap: balance; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  form { display: grid; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input {
    font: 16px var(--font); color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; min-width: 0;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button {
    font: 600 15px var(--font); border-radius: 8px; padding: 11px 16px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg);
  }
  button.ghost { background: transparent; color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  #status { min-height: 1.6em; margin: 0; font-size: 14px; color: var(--muted); }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  #result { display: grid; gap: 10px; }
  .meta { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; margin: 0; }
  .meta dt { color: var(--muted); }
  .meta dd { margin: 0; min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions button { flex: 1 1 140px; }
  pre {
    margin: 0; max-height: 55vh; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere;
    font: 13px/1.6 var(--mono); background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>分享對話轉 Log</h1>
    <p class="sub">貼上 loveydovey 分享連結，轉成 raw log 格式的 txt。</p>
  </header>

  <form id="form">
    <label>使用者名稱（取代 User）
      <input id="userName" autocomplete="off" placeholder="你在對話裡的名字；留空就保留 User">
    </label>
    <label>分享連結
      <input id="url" inputmode="url" autocomplete="off" placeholder="https://www.loveydovey.ai/share/…">
    </label>
    <button id="convert" type="submit">轉換</button>
    <p id="status" role="status"></p>
  </form>

  <section id="result" hidden>
    <dl class="meta">
      <dt>檔名</dt><dd id="fileName"></dd>
      <dt>則數</dt><dd id="count"></dd>
      <dt>時間</dt><dd id="range"></dd>
    </dl>
    <div class="actions">
      <button id="download" type="button">下載 txt</button>
      <button id="copy" type="button" class="ghost">複製全文</button>
    </div>
    <pre id="preview"></pre>
  </section>
</main>

<script>
// 分享頁是 SPA，資料實際存在 Firestore 的 MessageShares/<id>；這組是 loveydovey 前端公開的設定。
const FIRESTORE = "https://firestore.googleapis.com/v1/projects/reelso-prod/databases/(default)/documents/MessageShares/";
const API_KEY = "AIzaSyB4ocqQYdk7_QylMTS_a51Bq1T58sLOJtg";

const $ = (id) => document.getElementById(id);
let output = null;

try { const saved = localStorage.getItem("userName"); if (saved) $("userName").value = saved; } catch {}

// 只收 loveydovey.ai 的 /share/<id> 連結，或單獨的分享 id
function shareId(input) {
  const s = input.trim();
  if (/^[A-Za-z0-9_-]{10,}$/.test(s)) return s;
  let u;
  try { u = new URL(s); } catch { return null; }
  if (u.protocol !== "https:" || !/^(www\.)?loveydovey\.ai$/.test(u.hostname)) return null;
  const m = u.pathname.match(/^\/share\/([A-Za-z0-9_-]+)\/?$/);
  return m ? m[1] : null;
}

// Firestore REST 的值是 {stringValue: …}/{mapValue: {fields}}… 這種包裝，攤平成一般物件
function plain(v) {
  if (v == null) return null;
  if ("stringValue" in v) return v.stringValue;
  if ("timestampValue" in v) return v.timestampValue;
  if ("integerValue" in v) return Number(v.integerValue);
  if ("doubleValue" in v) return v.doubleValue;
  if ("booleanValue" in v) return v.booleanValue;
  if ("nullValue" in v) return null;
  if ("arrayValue" in v) return (v.arrayValue.values || []).map(plain);
  if ("mapValue" in v) return fields(v.mapValue.fields || {});
  return null;
}
function fields(f) { return Object.fromEntries(Object.entries(f).map(([k, v]) => [k, plain(v)])); }

const taipei = new Intl.DateTimeFormat("en-CA", {
  timeZone: "Asia/Taipei", year: "numeric", month: "2-digit", day: "2-digit",
  hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23",
});
function parts(iso) {
  const p = Object.fromEntries(taipei.formatToParts(new Date(iso)).map((x) => [x.type, x.value]));
  return { date: `${p.year}-${p.month}-${p.day}`, time: `${p.hour}:${p.minute}:${p.second}`, hm: `${p.hour}${p.minute}` };
}

function toLog(doc, userName) {
  const msgs = doc.messages || [];
  const lines = msgs.map((m) => {
    const who = m.type === "user" || m.senderName === "User" ? userName : m.senderName;
    const t = m.createdAt ? parts(m.createdAt) : null;
    const stamp = t ? `[${t.date} ${t.time}] ` : "";
    return `${stamp}${who}: ${(m.message || "").trim()}`;
  });
  const charName = (doc.character && doc.character.name) || "角色";
  const first = msgs.find((m) => m.createdAt);
  const last = [...msgs].reverse().find((m) => m.createdAt);
  const start = parts((first && first.createdAt) || doc.createdAt);
  const end = last ? parts(last.createdAt) : start;
  const safe = charName.replace(/[\\/:*?"<>|]/g, "_");
  return {
    text: lines.join("\n\n") + "\n",
    fileName: `${safe}_${start.date}_${start.hm}.txt`,
    count: msgs.length,
    range: `${start.date} ${start.time} – ${end.date === start.date ? "" : end.date + " "}${end.time}`,
  };
}

function setStatus(msg, kind) { $("status").textContent = msg; $("status").className = kind || ""; }

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const id = shareId($("url").value);
  const userName = $("userName").value.trim() || "User";
  try { localStorage.setItem("userName", userName); } catch {}
  $("result").hidden = true;
  if (!id) { setStatus("只接受 loveydovey.ai 的分享連結，像 https://www.loveydovey.ai/share/xxxx", "err"); return; }

  $("convert").disabled = true;
  setStatus("讀取中…");
  try {
    const res = await fetch(FIRESTORE + encodeURIComponent(id) + "?key=" + API_KEY);
    if (res.status === 404) throw new Error("找不到這則分享，連結可能打錯或已被刪除。");
    if (res.status === 403 || res.status === 401) throw new Error("被拒絕存取（" + res.status + "），loveydovey 可能改了權限或換了 key。");
    if (!res.ok) throw new Error("讀取失敗（HTTP " + res.status + "）。");
    const doc = fields((await res.json()).fields || {});
    if (!doc.messages || !doc.messages.length) throw new Error("這則分享沒有訊息。");
    output = toLog(doc, userName);
    $("fileName").textContent = output.fileName;
    $("count").textContent = output.count + " 則";
    $("range").textContent = output.range;
    $("preview").textContent = output.text;
    $("result").hidden = false;
    setStatus("轉換完成", "ok");
  } catch (err) {
    setStatus(err instanceof TypeError ? "連線失敗，檢查網路後再試一次。" : err.message, "err");
  } finally {
    $("convert").disabled = false;
  }
});

$("download").addEventListener("click", () => {
  if (!output) return;
  const url = URL.createObjectURL(new Blob([output.text], { type: "text/plain;charset=utf-8" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: output.fileName });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

$("copy").addEventListener("click", async () => {
  if (!output) return;
  try { await navigator.clipboard.writeText(output.text); setStatus("已複製全文", "ok"); }
  catch {
    const r = document.createRange(); r.selectNodeContents($("preview"));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    setStatus("無法直接複製，已選取預覽，請手動複製。", "err");
  }
});
</script>
</body>
</html>
